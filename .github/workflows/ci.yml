name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if Prisma is used
        id: prisma_check
        run: |
          if [ -f prisma/schema.prisma ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -d prisma/migrations ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Prisma client
        if: steps.prisma_check.outputs.exists == 'true'
        run: npx prisma generate

      # biome ci は lint とフォーマットを書き換えずに検査する。
      # package.json の script に依存させない（リポジトリ側の lint 定義がぶれても検査が止まらないため）。
      # --no: ローカル node_modules の biome を強制し、未導入なら明示的に失敗させる
      #       （付けないと未導入時にレジストリから最新版を黙って取得し、バージョンdrift・供給網リスクになる）
      - name: Lint & Format check
        run: npx --no biome ci .

      # 型チェック。vitest は型を検査しないため、型エラーは next build 等のデプロイ時まで表面化しない。
      # Prisma 生成クライアントを参照するリポジトリがあるため、Generate Prisma client より後に置く。
      # tsc -b: tsconfig の references（Vite 系の tsconfig.app.json 等）もたどって検査する。
      #         ルートが "files": [] の構成では tsc --noEmit だと 0 ファイル検査で素通りするため -b を使う。
      # --: これがないと npm が -b を自分の config（--b）として解釈し、tsc に渡らない（プレーンモードで素通りする）。
      - name: Type check
        run: npx --no -- tsc -b

      - name: Unit test
        run: npm run test

      # schema.prisma と prisma/migrations のずれを検出する。ずれると、次の migrate dev が
      # DROP を含む migration を生成する／DB に無い制約を前提にコードが動く、のどちらかで静かに壊れる。
      # CI の中だけで使い捨ての Postgres を立て、全 migration を適用した DB と schema.prisma を比べる
      # （--exit-code: 差分なし 0 / エラー 1 / 差分あり 2）。接続情報は不要。
      # 検出できないもの: 適用済み migration の後からの書き換え、生 SQL だけで作るオブジェクト（CHECK・トリガー等）。
      # DIRECT_URL: 配布先の prisma.config.ts が datasource.url として読む環境変数。
      # migrations が無いリポジトリ（db push 運用）は比べる対象が無いため走らせない。
      # Docker Hub からの pull という外部依存を持つため、lint・型・テストの結果を先に出せるよう後ろに置く。
      - name: Schema / migration drift check
        if: steps.prisma_check.outputs.exists == 'true' && steps.prisma_check.outputs.migrations == 'true'
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          docker run -d --name drift-pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17
          # -h 127.0.0.1: TCP で確かめる。公式イメージは初回の初期化中に Unix ソケットだけの一時サーバーを
          #   立てるため、ソケットで確かめると一時サーバーに ready を返され、本番サーバーの起動前に接続しうる。
          # 上限 60 秒: コンテナが起動直後に落ちると pg_isready は失敗し続け、上限が無いとジョブのタイムアウトまで回る。
          for _ in $(seq 60); do
            docker exec drift-pg pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec drift-pg pg_isready -h 127.0.0.1 -U postgres
          npx --no prisma migrate deploy
          npx --no prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code || {
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::schema.prisma と prisma/migrations がずれています。schema を変えたなら prisma migrate dev で migration を作り、migration を変えたなら schema に反映してください"
            fi
            exit "$rc"
          }

      # deploy ワークフローが実行するビルドを PR 時点で前倒しし、型エラー以外のビルド破壊
      # （依存解決・バンドラ設定の破壊など）を検知する。時間がかかるため最後に置く。
      # 判定は配布された deploy ワークフローの有無で行い、プロファイルと一致させる。
      # コマンドは各 deploy ワークフロー（deploy-*.yml）の Build ステップと揃えること。
      # build（vercel-app / render-app）はプロバイダ側で環境変数を前提に実行されるため対象外。
      - name: Detect deploy build
        id: deploy_build
        run: |
          if [ -f .github/workflows/deploy-cloudflare-workers.yml ]; then
            echo "script=pages:build" >> "$GITHUB_OUTPUT"
          elif [ -f .github/workflows/deploy-github-pages.yml ]; then
            echo "script=build:static" >> "$GITHUB_OUTPUT"
          fi

      - name: Build check
        if: steps.deploy_build.outputs.script != ''
        run: npm run ${{ steps.deploy_build.outputs.script }}
