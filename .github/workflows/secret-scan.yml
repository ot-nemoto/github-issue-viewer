name: secret-scan

# 秘密情報の混入検出（gitleaks）。ci.yml とは意図的に分離している。
#  - トリガーが違う: PR は差分のみ、schedule は全履歴（すでに履歴に入った値を拾うため）
#  - 失敗の意味が違う: lint・型・テスト・ビルドのマージゲートを誤検知で止めたくない
#
# GitHub の secret scanning / push protection が検出するのは、発行元が登録した
# プロバイダ固有パターン（sk_live_… / AKIA… 等）に限られる。自前の接頭辞を検出させるには
# custom patterns（GitHub Secret Protection = 有料）が必要で、無料の public リポジトリでは
# 使えない。本ワークフローはその穴を埋める。
#
# ルール・allowlist はリポジトリ直下の .gitleaks.toml が自動で読まれる（無ければ既定ルール）。
# カスタムルールや allowlist の対象はリポジトリごとに異なるため、.gitleaks.toml は配布せず
# 各リポジトリが所有する（雛形は dev-commons の scaffold/.gitleaks.toml）。

on:
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # 全履歴スキャンには全コミットが必要（既定の shallow clone では走査できない）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 公式の gitleaks-action は Organization で有料ライセンスキーを要求するため CLI を直接使う。
      # バージョンは固定する: latest だと検出ルールの変化で CI の挙動が黙って変わる
      # （actions のバージョン管理方針と同じ。更新は dev-commons 側で行う）。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # 公式 gitleaks_<version>_checksums.txt の値。バージョンを上げるときは必ず同時に更新する。
          # リリース同梱の checksums.txt を実行時に参照する形にはしない（リリース自体が
          # 差し替えられた場合に検証の意味が無くなるため、ここに直書きする）。
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version

      # --redact: public リポジトリの CI ログに検出値そのものを出さない。
      # -v: 検出時にファイル・行・ルールを出す。無いと件数しか出ず、失敗しても何を直せばよいか
      #     CI ログから分からない（--redact 併用で値は REDACTED になるため追加の露出はない）。
      # github コンテキストは env 経由で渡す（run への直接展開はコマンド注入になりうる）。
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR は base..head の範囲（途中のコミットで追加され後で消された値も拾える）
            gitleaks git . --no-banner --redact -v --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          else
            # schedule / 手動は全履歴 ＋ HEAD ツリー。
            # git log -p はマージコミットの patch を既定で出さないため、コンフリクト解決時にのみ
            # 混入した値は履歴スキャンでは拾えない（実測で確認）。dir スキャンで現状を必ず覆う。
            # 両方を走らせてから終了コードをまとめる（片方で止めると残りの検出が見えない）。
            rc=0
            gitleaks git . --no-banner --redact -v || rc=1
            gitleaks dir . --no-banner --redact -v || rc=1
            exit $rc
          fi
